# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.dang-sdk]
source = "github.com/dagger/dang-sdk"

[sdks.dang]
module = "dang-sdk"

[modules.ci]
source = ".dagger/modules/ci"

[sdks.dang.scopes.".dagger/modules/ci"]
is-module = true
name = "ci"
