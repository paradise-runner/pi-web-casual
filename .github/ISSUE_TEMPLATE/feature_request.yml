name: Feature request
description: Suggest an improvement for Casual
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please explain the workflow you want to improve.

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What is difficult or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Casual do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / native PI WEB behavior
        - ⁂ button or tab placement
        - Hidden Casual project
        - First-run setup
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
