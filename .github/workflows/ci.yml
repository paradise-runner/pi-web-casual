name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Self-hosted Mac runner. `darwin` is a label we register on both the
    # GitHub Actions runner and the Forgejo runner, so this file works for
    # either forge without edits.
    runs-on: [self-hosted, darwin]
    steps:
      - uses: actions/checkout@v4

      # Dagger is installed and pinned on the runner itself (see
      # docs/dagger-ci.md). Nothing here downloads or builds a toolchain:
      # every step below runs in the engine's containers.
      - name: Dagger checks
        run: dagger check --progress=plain
        env:
          DAGGER_NO_NAG: "1"
          DO_NOT_TRACK: "1"
