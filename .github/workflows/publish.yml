name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish for real (leave unchecked for a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish (dry run)
        if: ${{ !inputs.publish }}
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ inputs.publish }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
